<style>.pulse-ring {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: rgba(116, 89, 247, 0.3);
    /* secondary-container with opacity */
    animation: pulse-animation 2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    z-index: -1
    }
.pulse-ring:nth-child(2) {
    animation-delay: 0.6s
    }
.pulse-ring:nth-child(3) {
    animation-delay: 1.2s
    }
@keyframes pulse-animation {
    0% {
        transform: scale(0.8);
        opacity: 0.8;
        } 100% {
        transform: scale(1.8);
        opacity: 0;
        }
    }
/* Simulated background for context */

<body class="antialiased min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Voice Input Overlay Modal -->
<div class="fixed inset-0 z-50 flex flex-col bg-surface/85 backdrop-blur-2xl">
<!-- Header: Close Button -->
<header class="w-full flex justify-end p-margin-mobile md:p-margin-desktop">
<button aria-label="Close modal" class="w-tap-target-min h-tap-target-min flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Center Content: Orb and Transcription -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop gap-xl max-w-4xl mx-auto w-full text-center">
<!-- Animated Waveform Orb -->
<div class="relative flex flex-col items-center gap-md">
<div class="relative flex items-center justify-center w-[120px] h-[120px] rounded-full bg-gradient-to-tr from-secondary to-secondary-container shadow-[0_8px_32px_rgba(91,60,221,0.4)]">
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<div class="pulse-ring"></div>
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mt-lg animate-pulse">
                    Listening... Suno
                </h2>
</div>
<!-- Transcription Area -->
<div class="w-full max-w-2xl mt-xl bg-surface-container-lowest/50 backdrop-blur-md rounded-xl p-lg border border-white/40 shadow-sm min-h-[160px] flex items-center justify-center">
<p class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface opacity-90 transition-all duration-300">
                    "Mujhe farming scheme ke baare mein batayein..."
                </p>
</div>
</main>
<!-- Footer Actions -->
<footer class="w-full flex flex-col sm:flex-row justify-center items-center gap-md p-margin-mobile md:p-margin-desktop pb-safe mb-8">
<button class="w-full sm:w-auto min-w-[160px] h-tap-target-min flex items-center justify-center gap-sm px-xl rounded-full bg-error text-on-error font-label-lg text-label-lg shadow-md hover:bg-on-error-container hover:text-white transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
                Stop
            </button>
<button class="w-full sm:w-auto min-w-[160px] h-tap-target-min flex items-center justify-center gap-sm px-xl rounded-full bg-surface-container-lowest text-on-surface font-label-lg text-label-lg border-2 border-outline-variant hover:bg-surface-container transition-colors active:scale-95 duration-200 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
                Retry
            </button>
</footer>
</div>
</body></html>
